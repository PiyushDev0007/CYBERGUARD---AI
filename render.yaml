services:
  - type: web
    name: cyberguard-x-backend
    runtime: python
    region: singapore
    plan: free

    buildCommand: >
      pip install -r requirements.txt &&
      playwright install --with-deps chromium

    startCommand: >
      uvicorn backend.app:app
      --host 0.0.0.0
      --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
